<!DOCTYPE html>
<html>
<head>
    <title>Whitelist Payment - DeFi Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            max-width: 500px; 
            margin: auto; 
            text-align: center;
            padding: 20px;
            background: #ecfdf5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid #a7f3d0;
        }
        .address { 
            background: #f0fdf4; 
            padding: 15px; 
            border-radius: 10px; 
            word-break: break-all;
            margin: 20px 0;
            font-size: 14px;
            border: 1px solid #bbf7d0;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
        }
        .network { color: #64748b; font-size: 14px; }
        .back-link { display: block; margin: 20px 0; color: #3b82f6; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Portfolio</a>
    
    <div class="container">
        <h2>🚀 DeFi Project Whitelist</h2>
        <p>Secure your spot in our token launch</p>
        
        <div class="address" id="address">0x5B38Da6a701c568545dCfcB03FcB875f56beddC4</div>
        <button onclick="copyAddress()">Copy Wallet Address</button>
        
        <div id="qrcode" style="margin: 25px 0;"></div>
        
        <p><strong>Amount:</strong> 49 USDC</p>
        <p class="network">Network: Polygon (Recommended for low fees)</p>
        <p style="color: #ef4444; font-size: 12px;">Whitelist confirmed within 1 hour of payment</p>
    </div>

    <script>
        function copyAddress() {
            navigator.clipboard.writeText("0x5B38Da6a701c568545dCfcB03FcB875f56beddC4");
            alert("✅ Address copied to clipboard!");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById("qrcode"), "0x5B38Da6a701c568545dCfcB03FcB875f56beddC4");
    </script>
</body>
</html>
