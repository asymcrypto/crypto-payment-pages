<!DOCTYPE html>
<html>
<head>
    <title>Payment - CryptoConsultant.pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-3d {
            transform: perspective(1000px) rotateY(0deg) rotateX(0deg);
            transition: all 0.5s ease;
            box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.3);
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .address-box {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border: 2px solid #3b82f6;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen py-8">
    <div class="container mx-auto px-4 max-w-md">
        <!-- Back Button -->
        <a href="index.html" class="inline-flex items-center text-white mb-6 hover:text-blue-200 transition-colors">
            <i class="fas fa-arrow-left mr-2"></i> Back to Portfolio
        </a>

        <!-- Payment Card -->
        <div class="card-3d bg-white rounded-2xl p-6 border border-white/20">
            <!-- Header -->
            <div class="text-center mb-6">
                <div class="w-20 h-20 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-chart-line text-3xl text-blue-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">CryptoConsultant.pro</h1>
                <p class="text-gray-600 mt-2">1-Hour Strategy Session</p>
            </div>

            <!-- Amount -->
            <div class="bg-blue-50 rounded-xl p-4 text-center mb-6">
                <p class="text-sm text-blue-600">Amount to pay</p>
                <p class="text-2xl font-bold text-blue-800">0.1 ETH</p>
                <p class="text-sm text-blue-600 mt-1">Ethereum Mainnet</p>
            </div>

            <!-- Address -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Wallet Address</label>
                <div class="address-box rounded-xl p-4 mb-3">
                    <p id="address" class="text-sm font-mono break-all">0x71C7656EC7ab88b098defB751B7401B5f6d8976F</p>
                </div>
                <button onclick="copyAddress()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition-all duration-300 transform hover:scale-105 flex items-center justify-center">
                    <i class="fas fa-copy mr-2"></i> Copy Address
                </button>
            </div>

            <!-- QR Code -->
            <div class="text-center mb-6">
                <p class="text-sm text-gray-600 mb-3">Or scan QR code</p>
                <div id="qrcode" class="inline-block p-4 bg-white rounded-xl border-2 border-blue-200"></div>
            </div>

            <!-- Warning -->
            <div class="bg-red-50 border border-red-200 rounded-xl p-4">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>
                    <p class="text-sm text-red-700 font-medium">Double-check the address before sending</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function copyAddress() {
            navigator.clipboard.writeText("0x71C7656EC7ab88b098defB751B7401B5f6d8976F");
            alert("✅ Address copied to clipboard!");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById("qrcode"), "0x71C7656EC7ab88b098defB751B7401B5f6d8976F");
    </script>
</body>
