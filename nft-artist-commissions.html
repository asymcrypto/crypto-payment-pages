<!DOCTYPE html>
<html>
<head>
    <title>Commission - NFT Artist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            max-width: 500px; 
            margin: auto; 
            text-align: center;
            padding: 20px;
            background: #fef7ed;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 2px solid #fed7aa;
        }
        .address { 
            background: #fffbeb; 
            padding: 15px; 
            border-radius: 10px; 
            word-break: break-all;
            margin: 20px 0;
            font-size: 14px;
            border: 1px solid #fed7aa;
        }
        button {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
        }
        .network { color: #64748b; font-size: 14px; }
        .back-link { display: block; margin: 20px 0; color: #3b82f6; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Portfolio</a>
    
    <div class="container">
        <h2>🎨 NFT Artist Commission</h2>
        <p>Custom 1/1 artwork - delivery in 7 days</p>
        
        <div class="address" id="address">0x8ba1f109551bD432803012645Ac136ddd64DBA72</div>
        <button onclick="copyAddress()">Copy Wallet Address</button>
        
        <div id="qrcode" style="margin: 25px 0;"></div>
        
        <p><strong>Amount:</strong> 0.05 ETH</p>
        <p class="network">Network: Ethereum Mainnet</p>
        <p style="color: #ef4444; font-size: 12px;">After payment, DM your artwork details</p>
    </div>

    <script>
        function copyAddress() {
            navigator.clipboard.writeText("0x8ba1f109551bD432803012645Ac136ddd64DBA72");
            alert("✅ Address copied to clipboard!");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script>
        new QRCode(document.getElementById("qrcode"), "0x8ba1f109551bD432803012645Ac136ddd64DBA72");
    </script>
</body>
</html>
